<!-- The Floating Bubble Button -->
<button 
  (click)="toggleChat()"
  class="fixed bottom-8 right-8 h-14 px-6 bg-blue-600 rounded-full shadow-2xl text-white flex items-center gap-3 hover:bg-blue-700 hover:-translate-y-1 transition-all duration-300 z-50 font-medium text-lg tracking-wide">
  <mat-icon class="!text-3xl !w-8 !h-8">{{ isOpen ? 'close' : 'smart_toy' }}</mat-icon>
  <span>{{ isOpen ? 'Close Chat' : 'Ask AI Assistant' }}</span>
</button>

<!-- The Chat Window (Only visible if isOpen is true) -->
@if (isOpen) {
  <div class="fixed bottom-28 right-8 w-96 bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden z-50 flex flex-col h-[500px]">
    
    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 flex items-center gap-3">
      <mat-icon>smart_toy</mat-icon>
      <div class="flex-1">
        <h3 class="font-bold text-lg m-0">AI Assistant</h3>
        <p class="text-blue-100 text-xs m-0">Powered by Azure OpenAI</p>
      </div>
    </div>
    
        <!-- Chat Area -->
    <div class="flex-1 p-4 overflow-y-auto bg-slate-50 flex flex-col gap-4">
      
      <!-- Welcome Message (Only show if history is completely empty) -->
      @if (chatHistory().length === 0) {
        <div class="bg-blue-100 text-blue-900 rounded-2xl rounded-tl-none p-4 max-w-[90%] self-start text-sm shadow-sm whitespace-pre-wrap">
          Hello {{ userName }}! I am your AI assistant. How can I help you today?
        </div>
      }

      <!-- Loop through the Array of Messages! -->
      @for (msg of chatHistory(); track $index) {
        <div 
          class="p-4 max-w-[90%] text-sm shadow-sm whitespace-pre-wrap rounded-2xl"
          
          [class.bg-blue-100]="msg.role === 'ai'"
          [class.text-blue-900]="msg.role === 'ai'"
          [class.rounded-tl-none]="msg.role === 'ai'"
          [class.self-start]="msg.role === 'ai'"
          
          [class.bg-blue-600]="msg.role === 'user'"
          [class.text-white]="msg.role === 'user'"
          [class.rounded-tr-none]="msg.role === 'user'"
          [class.self-end]="msg.role === 'user'"
        >
          {{ msg.content }}
        </div>
      }
      
      <!-- The Spinner -->
      @if (isLoading()) {
        <div class="flex gap-2 items-center text-gray-400 text-sm self-start">
          <mat-icon class="animate-spin">sync</mat-icon> Thinking...
        </div>
      }
    </div>
    
    <!-- Input Area -->
    <div class="p-4 border-t border-gray-100 bg-white flex gap-2">
      <input 
        type="text" 
        [(ngModel)]="userInput" 
        (keyup.enter)="askAI()"
        placeholder="Type a message..." 
        [disabled]="isLoading()"
        class="flex-1 bg-slate-100 border-none rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        
      <button 
        (click)="askAI()"
        [disabled]="isLoading() || !userInput"
        class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center disabled:bg-gray-300 transition-colors">
        <mat-icon class="!text-lg !w-5 !h-5">send</mat-icon>
      </button>
    </div>
  </div>
}
