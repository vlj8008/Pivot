<div class="min-h-screen bg-neutral-100 p-8 flex justify-center">
  <div class="w-full max-w-6xl bg-white shadow-xl rounded-lg p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Task Management</h1>
    
    <!-- Search / Filter -->
    <div class="mb-6">
      <mat-form-field appearance="outline" class="w-full max-w-md">
        <mat-label>Filter</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="text" placeholder="Search tasks by title..." (input)="updateSearch($event)">
      </mat-form-field>
    </div>

    @if (filteredTasks().length === 0) {
      <div class="text-center py-10 text-gray-500">
        No tasks found matching your filter.
      </div>
    } @else {
      <!-- Data Grid -->
      <div class="mat-elevation-z8 overflow-hidden rounded-lg border border-gray-200">
        <table mat-table [dataSource]="filteredTasks()" matSort (matSortChange)="sortData($event)" class="w-full">
          
          <!-- Title Column -->
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-semibold text-gray-700">Title</th>
            <td mat-cell *matCellDef="let task">{{ task.title }}</td>
          </ng-container>

          <!-- Category Column -->
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-semibold text-gray-700">Category</th>
            <td mat-cell *matCellDef="let task">
              <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-medium">{{ task.category }}</span>
            </td>
          </ng-container>

          <!-- Due Date Column -->
          <ng-container matColumnDef="dueDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-semibold text-gray-700">Due Date</th>
            <td mat-cell *matCellDef="let task">{{ task.dueDate }}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-semibold text-gray-700">Status</th>
            <td mat-cell *matCellDef="let task">
              <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-xs font-medium">{{ task.status }}</span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="font-semibold text-gray-700 text-right">Actions</th>
            <td mat-cell *matCellDef="let task" class="text-right">
              <button mat-icon-button color="primary" disabled title="Edit Task (Coming Soon)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteTask(task.id)" title="Delete Task">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors cursor-pointer"></tr>
        </table>
      </div>
    }
  </div>
</div>
