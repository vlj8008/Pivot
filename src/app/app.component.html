<div class="min-h-screen bg-slate-200 flex flex-col">
  <mat-toolbar color="primary" class="shadow-md z-10 flex items-end px-6 !h-auto pt-3">
    <div class="flex items-end gap-12">
      <img src="assets/PivotLogo.png" alt="Pivot Logo" class="h-20 w-auto pb-2">
      
      <nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false" class="mt-auto !border-none">
        <a mat-tab-link [active]="true" class="!text-lg !font-medium !tracking-wide px-6">Task Management</a>
        <a mat-tab-link [active]="false" class="!text-lg !font-medium !tracking-wide px-6">Settings</a>
      </nav>
    </div>
  </mat-toolbar>
  <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>

  <main class="flex-1 p-4 md:p-10 flex justify-center">
    <app-task-list class="w-full max-w-6xl"></app-task-list>
  </main>
</div>
